<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="{{SUMMARY}}" />
    <title>PRD · {{TITLE}}</title>
    <link rel="stylesheet" href="./assets/styles.css?v={{ASSET_VERSION}}" />
    <script src="./assets/app.js?v={{ASSET_VERSION}}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="PRD navigation">
        <div class="sidebar-header">
          <a class="brand" href="#summary" aria-label="Project Advisor PRD home">
            <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="13.5" />
              <path d="M4 29.5 40 14.5" />
              <circle class="brand-mark-accent" cx="34" cy="17" r="3.5" />
            </svg>
            <span><strong>Project Advisor</strong><small>Decision review</small></span>
          </a>
        </div>
        <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false"
          aria-controls="sidebar-panel" aria-label="Open document navigation">
          <span class="nav-toggle-label">Contents</span>
          <span class="nav-toggle-icon" aria-hidden="true"></span>
        </button>
        <div id="sidebar-panel" class="sidebar-panel">
          <nav aria-label="Document sections">{{NAVIGATION}}</nav>
          <div class="sidebar-actions" role="group" aria-label="Review controls">
            {{DETAILS_CONTROL}}
            <button id="print-document" type="button">Print / Save PDF</button>
          </div>
        </div>
      </aside>
      <main id="content" tabindex="-1">
        <header id="summary" class="hero" aria-labelledby="document-title">
          <div class="hero-copy">
            <div class="hero-topline">
              <span class="eyebrow">Product requirements document</span>
              <span class="status" role="status" aria-label="Document status: {{STATUS}}">{{STATUS}}</span>
            </div>
            <h1 id="document-title">{{TITLE}}</h1>
            <p class="lede">{{SUMMARY}}</p>
          </div>
          <div class="hero-map" aria-label="Document context">
            <span class="map-label">Review map</span>
            <div class="map-core">
              <span>Working document</span>
              <strong>{{STATUS}}</strong>
              <small>Product direction, connected</small>
            </div>
            <dl class="metadata">{{METADATA}}</dl>
          </div>
        </header>
        {{BLOCKS}}
        <footer>
          <div><small>Review state</small><strong>{{STATUS}}</strong></div>
          <a href="#summary">Back to the beginning <span aria-hidden="true">↗</span></a>
        </footer>
      </main>
    </div>
  </body>
</html>
