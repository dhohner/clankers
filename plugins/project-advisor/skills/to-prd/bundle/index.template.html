<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="{{SUMMARY}}" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050506" />
    <title>PRD · {{TITLE}}</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/styles.css?v={{ASSET_VERSION}}" />
    <script src="./assets/app.js?v={{ASSET_VERSION}}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to the document</a>
    <div class="cyclorama" aria-hidden="true">
      <span class="cyc-wash"></span>
    </div>
    <header class="plot-bar">
      <a class="brand" href="#summary">
        <span class="brand-name">Project Advisor</span>
        <span class="brand-role">Decision review</span>
      </a>
      <p class="doc-status" data-state="{{STATUS_STATE}}">
        <span class="lamp" aria-hidden="true"></span>
        <span class="sr-only">Document status:</span>
        <span class="doc-status-word">{{STATUS}}</span>
      </p>
    </header>
    <div class="stage">
      <aside class="cue-sheet" aria-label="Cue sheet">
        <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false"
          aria-controls="sidebar-panel">
          <span class="nav-toggle-label">Cue sheet</span>
          <span class="nav-toggle-count">{{CUE_COUNT}}</span>
        </button>
        <div id="sidebar-panel" class="cue-sheet-panel">
          <nav aria-label="Document cues">{{NAVIGATION}}</nav>
          <div class="cue-actions" role="group" aria-label="Review controls">
            {{DETAILS_CONTROL}}
          </div>
        </div>
      </aside>
      <main id="content" tabindex="-1">
        <header id="summary" class="horizon" aria-labelledby="document-title">
          <h1 id="document-title">{{TITLE}}</h1>
          <p class="lede">{{SUMMARY}}</p>
          {{BOARD}}
          <dl class="plot-sheet" aria-label="Document context">{{METADATA}}</dl>
        </header>
        {{BLOCKS}}
        <footer class="houselights">
          <a class="houselights-link" href="#summary">Back to the top of the sheet</a>
        </footer>
      </main>
    </div>
  </body>
</html>
