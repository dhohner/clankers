schema_version: 2
slug: "fixture-document-only"
title: "Document-only PRD fixture"
summary: A compact planning document whose decisions do not require a specialized visual surface.
status: Draft
initiative_type: "small-feature"
review_surfaces:
  - document
metadata:
  Owner: Evaluation
blocks:
  problem:
    statement: Reviewers need a concise statement of a small product change.
    evidence:
      - "The decision can be understood without UI, workflow, API, data, or architecture visuals."
  goals:
    - goal: Make the intended outcome explicit.
      success_signal: A reviewer can accept or reject the scope without reconstructing missing context.
  scope:
    in:
      - Document the behavior and its validation intent.
    out:
      - Introduce a new user interface or system boundary.
  design_tree:
    - id: "NODE-REVIEW-SURFACE"
      label: Review surface
      question: Does this change need a specialized visual review surface?
      status: settled
      answer: "No. The document surface carries the whole decision."
      source: user
      rationale: "The change has no user interface, workflow, API, data, or architecture boundary."
      children:
        - id: "NODE-VISUAL-AID"
          label: Visual aid
          question: Should the document carry a diagram anyway?
          status: pruned
          reason: A diagram would repeat the prose without adding a review signal.
  testing_strategy:
    - id: "TEST-DOCUMENT"
      target: Planning completeness
      expected_outcome: "The document states the outcome, boundary, and acceptance evidence."
