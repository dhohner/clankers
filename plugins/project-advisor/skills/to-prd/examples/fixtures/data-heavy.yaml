schema_version: 2
slug: "fixture-data-heavy"
title: "Data-heavy PRD fixture"
summary: Traceability relationships remain stable as a planning source is regenerated.
status: Draft
initiative_type: "data-heavy"
review_surfaces:
  - document
  - data
metadata:
  Owner: Evaluation
blocks:
  problem:
    statement: "Requirements, decisions, risks, and tests can drift apart during revisions."
    evidence:
      - Stable identities and explicit relationships are needed for later issue splitting.
  requirements:
    - id: "REQ-STABLE-TRACE"
      title: Stable traceability
      description: Regeneration preserves durable entity identities and their declared relationships.
      validation:
        - "TEST-STABLE-TRACE"
  data_flow_diagram:
    description: "Repository evidence and interview findings become manifest entities; unresolved traceability blocks publication until fixed."
    source: |-
      flowchart TB
        subgraph Inputs
          interview[Interview findings]
          repo[Repository evidence]
        end
        interview --> manifest[Manifest entities]
        repo --> manifest
        manifest --> traceability{Traceability complete?}
        traceability -->|No| fix[Fix IDs or validation links]
        fix --> manifest
        traceability -->|Yes| bundle[Rendered PRD bundle]
  data_model:
    - entity: Planning entity
      definition: "A requirement, decision, risk, question, or test with a stable ID and typed relationships."
  security_privacy:
    - concern: Repository evidence may expose irrelevant sensitive details.
      response: Include only references that materially support a product statement.
  design_tree:
    - id: "NODE-ID-STABILITY"
      label: Identity stability
      question: Does a regenerated manifest keep the entity ids an earlier review already read?
      status: settled
      answer: An unchanged entity keeps its id across regeneration.
      source: user
      rationale: A renumbered id breaks every reference an earlier review recorded.
      relates_to:
        - "REQ-STABLE-TRACE"
      children:
        - id: "NODE-ID-FORMAT"
          label: Identity format
          question: Which text format does an entity id use?
          status: pruned
          reason: "The id format is a generator detail, not a product decision."
  testing_strategy:
    - id: "TEST-STABLE-TRACE"
      target: Traceability regeneration
      expected_outcome: Unchanged entities keep their IDs and every declared relationship resolves.
      validates:
        - "REQ-STABLE-TRACE"
