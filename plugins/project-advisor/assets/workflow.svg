<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 24 1280 476" width="1280" height="476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pa-workflow-title pa-workflow-desc">
    <title id="pa-workflow-title">Project Advisor workflow</title>
    <desc id="pa-workflow-desc">The next-thing skill picks one product bet, to-prd turns it into an accepted prd.yaml manifest through a design-tree interview and a revision loop, and once the manifest reaches status Accepted the work forks into to-issues, which writes German Jira slices, and to-agent-tasks, which writes self-contained tasks for autonomous coding agents.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5399"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fd6a23"/></marker>

    </defs>

    <rect x="0" y="24" width="1280" height="476" fill="#ffffff"/>

    <!-- connectors, drawn before nodes -->
    <line x1="240" y1="256" x2="296" y2="256" stroke="#4e5399" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="248" y="236" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="270" y="245" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PITCH</text>

    <line x1="504" y1="256" x2="560" y2="256" stroke="#4e5399" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="514" y="236" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="534" y="245" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">DRAFT</text>

    <path d="M 712,240 H 868 Q 876,240 876,232 V 164" fill="none" stroke="#fd6a23" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="764" y="220" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="790" y="229" fill="#c8430c" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">TRACKER</text>

    <path d="M 712,276 H 844 Q 852,276 852,284 V 348" fill="none" stroke="#fd6a23" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="758" y="256" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="782" y="265" fill="#c8430c" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">AGENTS</text>

    <line x1="976" y1="120" x2="1032" y2="120" stroke="#4e5399" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="976" y1="392" x2="1032" y2="392" stroke="#4e5399" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M 640,288 V 316 Q 640,324 632,324 H 412 Q 404,324 404,316 V 304" fill="none" stroke="#4e5399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="498" y="304" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="522" y="313" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REVISE</text>

    <!-- next-thing -->
    <rect x="40" y="216" width="200" height="80" rx="6" fill="#ffffff" stroke="rgba(0,3,92,0.20)" stroke-width="1"/>
    <rect x="52" y="228" width="52" height="12" rx="2" fill="none" stroke="rgba(0,3,92,0.28)" stroke-width="0.8"/>
    <text x="78" y="237" fill="#4e5399" font-size="7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 1</text>
    <text x="140" y="266" fill="#00035c" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">next-thing</text>
    <text x="140" y="282" fill="#4e5399" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">3 bets · 1 recommendation</text>

    <!-- to-prd -->
    <rect x="304" y="216" width="200" height="80" rx="6" fill="#ffffff" stroke="rgba(0,3,92,0.20)" stroke-width="1"/>
    <rect x="316" y="228" width="52" height="12" rx="2" fill="none" stroke="rgba(0,3,92,0.28)" stroke-width="0.8"/>
    <text x="342" y="237" fill="#4e5399" font-size="7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 2</text>
    <text x="404" y="266" fill="#00035c" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">to-prd</text>
    <text x="404" y="282" fill="#4e5399" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">design-tree interview</text>

    <!-- acceptance gate (focal) -->
    <rect x="568" y="224" width="144" height="64" rx="6" fill="rgba(253,106,35,0.07)" stroke="#fd6a23" stroke-width="1.2"/>
    <rect x="580" y="236" width="40" height="12" rx="2" fill="rgba(253,106,35,0.16)" stroke="rgba(253,106,35,0.50)" stroke-width="0.8"/>
    <text x="600" y="245" fill="#c8430c" font-size="7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
    <text x="640" y="268" fill="#00035c" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">prd.yaml</text>
    <text x="640" y="282" fill="#c8430c" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">status: Accepted</text>

    <!-- to-issues -->
    <rect x="776" y="80" width="200" height="80" rx="6" fill="#ffffff" stroke="rgba(0,3,92,0.20)" stroke-width="1"/>
    <rect x="788" y="92" width="52" height="12" rx="2" fill="none" stroke="rgba(0,3,92,0.28)" stroke-width="0.8"/>
    <text x="814" y="101" fill="#4e5399" font-size="7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 3</text>
    <text x="876" y="130" fill="#00035c" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">to-issues</text>
    <text x="876" y="146" fill="#4e5399" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">German tracer bullets</text>

    <!-- to-agent-tasks -->
    <rect x="776" y="352" width="200" height="80" rx="6" fill="#ffffff" stroke="rgba(0,3,92,0.20)" stroke-width="1"/>
    <rect x="788" y="364" width="52" height="12" rx="2" fill="none" stroke="rgba(0,3,92,0.28)" stroke-width="0.8"/>
    <text x="814" y="373" fill="#4e5399" font-size="7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 3</text>
    <text x="876" y="402" fill="#00035c" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">to-agent-tasks</text>
    <text x="876" y="418" fill="#4e5399" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">self-contained tasks</text>

    <!-- Jira issues -->
    <rect x="1040" y="80" width="200" height="80" rx="6" fill="#ffffff" stroke="rgba(0,3,92,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="1052" y="92" width="52" height="12" rx="2" fill="none" stroke="rgba(0,3,92,0.28)" stroke-width="0.8"/>
    <text x="1078" y="101" fill="#4e5399" font-size="7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
    <text x="1140" y="130" fill="#00035c" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Jira issues</text>
    <text x="1140" y="146" fill="#4e5399" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">jira-issues/NN-*.md</text>

    <!-- Agent tasks -->
    <rect x="1040" y="352" width="200" height="80" rx="6" fill="#ffffff" stroke="rgba(0,3,92,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="1052" y="364" width="52" height="12" rx="2" fill="none" stroke="rgba(0,3,92,0.28)" stroke-width="0.8"/>
    <text x="1078" y="373" fill="#4e5399" font-size="7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
    <text x="1140" y="402" fill="#00035c" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Agent tasks</text>
    <text x="1140" y="418" fill="#4e5399" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">agent-tasks/NN-*.md</text>

    <!-- legend -->
    <line x1="40" y1="464" x2="1240" y2="464" stroke="rgba(0,3,92,0.10)" stroke-width="0.8"/>
    <text x="40" y="486" fill="#4e5399" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="128" y="476" width="16" height="12" rx="2" fill="#ffffff" stroke="rgba(0,3,92,0.20)" stroke-width="0.8"/>
    <text x="152" y="486" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Skill stage</text>

    <rect x="352" y="476" width="16" height="12" rx="2" fill="rgba(253,106,35,0.07)" stroke="#fd6a23" stroke-width="0.8"/>
    <text x="376" y="486" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Acceptance gate</text>

    <rect x="576" y="476" width="16" height="12" rx="2" fill="#ffffff" stroke="rgba(0,3,92,0.28)" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="600" y="486" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Written files</text>

    <line x1="800" y1="482" x2="836" y2="482" stroke="#4e5399" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="848" y="486" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Handoff</text>

    <line x1="1024" y1="482" x2="1060" y2="482" stroke="#4e5399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="1072" y="486" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Revision loop</text>
  </svg>
