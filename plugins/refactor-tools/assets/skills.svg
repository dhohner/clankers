  <rect x="40" y="180" width="200" height="80" rx="6" fill="rgba(78,83,153,0.10)" stroke="#676ca8" stroke-width="1"/>
  <rect x="52" y="192" width="40" height="12" rx="2" fill="none" stroke="rgba(0,3,92,0.28)" stroke-width="0.8"/>
  <text x="72" y="201" fill="#4e5399" font-size="7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="140" y="230" fill="#00035c" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Your change</text>
  <text x="140" y="246" fill="#4e5399" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">staged · commits · paths</text>

