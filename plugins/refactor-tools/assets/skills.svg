<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 32 968 428" width="968" height="428" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rt-skills-title rt-skills-desc">
  <title id="rt-skills-title">Refactor Tools skills</title>
  <desc id="rt-skills-desc">You invoke one of three skills on staged changes, commits, or paths. simplify applies safe code simplifications as unstaged edits, review-changes scores the change across six dimensions without editing anything, and tighten-prose rewrites prose without changing its meaning.</desc>
  <defs>
    <marker id="rt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e5399"/></marker>
    <marker id="rt-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fd6a23"/></marker>
  </defs>

  <rect x="0" y="32" width="968" height="428" fill="#ffffff"/>

  <!-- connectors, drawn before nodes -->
  <path d="M 240,200 H 264 Q 272,200 272,192 V 108 Q 272,100 280,100 H 344" fill="none" stroke="#4e5399" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
  <rect x="294" y="80" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="312" y="89" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">CODE</text>

  <line x1="240" y1="220" x2="344" y2="220" stroke="#4e5399" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
  <rect x="294" y="200" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="312" y="209" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">DIFF</text>

  <path d="M 240,240 H 264 Q 272,240 272,248 V 332 Q 272,340 280,340 H 344" fill="none" stroke="#4e5399" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
  <rect x="292" y="320" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="312" y="329" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PROSE</text>

  <line x1="584" y1="100" x2="688" y2="100" stroke="#4e5399" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
  <rect x="612" y="80" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="632" y="89" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">APPLY</text>

  <line x1="584" y1="220" x2="688" y2="220" stroke="#fd6a23" stroke-width="1.2" marker-end="url(#rt-arrow-accent)"/>
  <rect x="612" y="200" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="632" y="209" fill="#c8430c" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">SCORE</text>

  <line x1="584" y1="340" x2="688" y2="340" stroke="#4e5399" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
  <rect x="608" y="320" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="632" y="329" fill="#676ca8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REWRITE</text>

