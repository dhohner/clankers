name: TypeScript

on:
  push:
    branches: [main]
    paths:
      - "plugins/insomniac/**"
      - "plugins/output-styles/**"
      - "plugins/security-guard/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vitest.config.mts"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths:
      - "plugins/insomniac/**"
      - "plugins/output-styles/**"
      - "plugins/security-guard/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vitest.config.mts"
      - ".github/workflows/typescript.yml"

permissions:
  contents: read

jobs:
  check:
    # The insomniac tests compile a stub with cc and rely on launchd adopting orphaned
    # processes, so they need macOS.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check packages
        # Each package's check script runs its lint, format check, tests, and typecheck.
        run: pnpm --recursive run check
      - name: Test insomniac
        # insomniac has no package.json, so only the root Vitest config runs its tests.
        run: pnpm exec vitest run --project insomniac
