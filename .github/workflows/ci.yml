name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request replaces the run for the previous push. Runs on main finish, so
# every commit on main keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists the changed files of a pull request through the API.
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            typescript:
              - "plugins/insomniac/**"
              - "plugins/output-styles/**"
              - "plugins/security-guard/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "vitest.config.mts"
              - ".github/workflows/ci.yml"
            python:
              - "plugins/project-advisor/skills/to-prd/**"
              # The root package.json holds the Python scripts and the ruff version.
              - "package.json"
              - ".github/workflows/ci.yml"
            workflows:
              - ".github/**"
              # The root package.json holds the workflow lint script and the tool versions.
              - "package.json"

  typescript-lint-and-coverage:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint, check format, and typecheck
        run: pnpm lint:ts
      # Only output-styles has a coverage gate. Its tests read local files only, so they run
      # here instead of in the slower macOS job, and typescript-test skips them.
      - name: Check coverage
        run: pnpm coverage:ts

  typescript-test:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    # The insomniac tests compile a stub with cc and rely on launchd adopting orphaned
    # processes, so they need macOS.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test:ts:uncovered

  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # These scripts need no Node packages. Without this, pnpm installs the whole workspace
      # before running them.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # python-lint and workflows-lint cache different tools, so each needs its own key.
          cache-suffix: python-lint
          # The lint:py script in package.json pins the ruff version.
          cache-dependency-glob: package.json
      - name: Lint and check format
        run: pnpm lint:py

  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    # The tests use SIGALRM, SIGSTOP, and SIGKILL, so they need a POSIX runner. macOS matches
    # the machine the suite is tuned on.
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      # See python-lint.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Test
        run: pnpm test:py
        env:
          # Shared runners are slower and noisier than a local machine.
          TO_PRD_TEST_TIME_SCALE: "3"

  workflows-lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # See python-lint.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-suffix: workflows-lint
          # The lint:workflows script in package.json pins the actionlint and zizmor versions.
          cache-dependency-glob: package.json
      - name: Lint workflows
        run: pnpm lint:workflows
        env:
          # With a token, zizmor also runs its online audits, such as checking that each pinned
          # SHA belongs to the action's repository.
          GH_TOKEN: ${{ github.token }}

  # Branch protection requires this job alone. Jobs that the path filter skips count as
  # passing, and a failed or cancelled job fails this one.
  ci-ok:
    if: always()
    needs: [changes, typescript-lint-and-coverage, typescript-test, python-lint, python-test, workflows-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
